version: 2.1

# CircleCI の pipeline「ci」（hideokamoto/circleci-infra の wp_cpt_rest_stiky.tf）が
# 全ブランチの push でこのファイルを読む。

jobs:
  # wp-env で本物の WordPress（tests-cli コンテナ）を立ち上げ、その中で PHPUnit を回す。
  # ひな形は hideokamoto/wp-kyoto-my-functions の .circleci/config.yml。
  # composer も phpunit もコンテナの中で動くので、ホストに PHP は入れない。
  phpunit:
    machine:
      image: ubuntu-2404:current
    resource_class: medium.gen2
    # wp-env はチェックアウトしたディレクトリの名前でプラグインを置く。
    # npm スクリプトは wp-content/plugins/wp-cpt-rest-stiky を前提にしている
    working_directory: ~/wp-cpt-rest-stiky
    parameters:
      php_version:
        type: string
      wp_version:
        type: string
    environment:
      WP_ENV_START_TIMEOUT: "120000"
    steps:
      - checkout
      - run:
          name: Install Node.js 22 (nvm)
          command: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
            fi
            \. "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm alias default 22
            nvm use 22
            echo 'export NVM_DIR="$HOME/.nvm"' >> "$BASH_ENV"
            echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"' >> "$BASH_ENV"
            echo 'nvm use 22 >/dev/null' >> "$BASH_ENV"
            node -v
            npm -v
      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "package-lock.json" }}
            - v1-npm-deps-
      - run:
          name: Install Node dependencies
          command: npm ci
      - save_cache:
          key: v1-npm-deps-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Configure wp-env override (WordPress / PHP)
          command: |
            set -euo pipefail
            WP_VERSION="<< parameters.wp_version >>"
            if [ "$WP_VERSION" = "latest" ]; then
              WP_CORE_VALUE="null"
            else
              WP_CORE_VALUE="\"WordPress/WordPress#${WP_VERSION}\""
            fi
            cat > .wp-env.override.json \<< EOF
            {
              "core": ${WP_CORE_VALUE},
              "phpVersion": "<< parameters.php_version >>"
            }
            EOF
            cat .wp-env.override.json
      - run:
          name: Start wp-env
          command: npm run wp-env start
      - run:
          name: Install Composer dependencies inside wp-env
          command: |
            set -euo pipefail
            npx wp-env run tests-cli --env-cwd=wp-content/plugins/wp-cpt-rest-stiky \
              composer install --no-interaction --no-progress
      - run:
          name: Show PHP and WordPress versions used by the tests
          command: |
            set -euo pipefail
            npx wp-env run tests-cli php -v
            npx wp-env run tests-cli wp core version
      - run:
          name: Run PHPUnit
          command: |
            set -euo pipefail
            mkdir -p test-results/phpunit
            npx wp-env run tests-cli --env-cwd=wp-content/plugins/wp-cpt-rest-stiky \
              vendor/bin/phpunit --log-junit test-results/phpunit/junit.xml
      - store_test_results:
          path: test-results
      - run:
          name: Stop wp-env
          command: npm run wp-env stop
          when: always

workflows:
  # PR でも main でも PHPUnit を回す。
  # - 最新: PHP 8.4 / WordPress 最新（2026-11 時点で 7.1.x）。readme.txt の Tested up to の根拠
  # - 下限: PHP 7.4 / WordPress 6.5。プラグインヘッダーの Requires PHP / Requires at least の根拠
  test:
    jobs:
      - phpunit:
          name: phpunit-php7.4-wp6.5
          php_version: "7.4"
          wp_version: "6.5"
      - phpunit:
          name: phpunit-php8.4-wp-latest
          php_version: "8.4"
          wp_version: latest
